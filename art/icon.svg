<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C2410C"/>
      <stop offset="1" stop-color="#431407"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#431407" flood-opacity="0.36"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- A megaphone, because the Control Panel already shows this addon as
       `share-mega-phone`: the icon is the same thing a user meets in the nav.
       A partner programme is other people speaking for you; the two sound
       waves are that word travelling on.

       Burnt copper, darker than Products' orange and redder than Lead Magnets'
       amber, because the warm hues next to the checkout family are taken and a
       commission is, in the end, coin. -->
  <!-- shifted left so the waves and the mouthpiece sit evenly in the square -->
  <g transform="translate(-28 0)">
  <g filter="url(#sh)">
    <!-- mouthpiece and bell -->
    <path d="M92 214 A18 18 0 0 1 110 196 L176 196 L330 118 A16 16 0 0 1 354 132 L354 380 A16 16 0 0 1 330 394 L176 316 L110 316 A18 18 0 0 1 92 298 Z" fill="#FFFFFF"/>
    <!-- handle -->
    <path d="M150 316 L196 316 L222 402 A16 16 0 0 1 206 422 L182 422 A16 16 0 0 1 166 410 Z" fill="#FFFFFF"/>
  </g>

  <!-- the band where the bell meets the mouthpiece, punched with the background -->
  <rect x="164" y="196" width="24" height="120" fill="url(#bg)"/>

  <!-- the word travelling on. Thick on purpose: at 24 pixels the arcs are what
       says "loud" rather than "funnel". -->
  <path d="M388 204 A64 64 0 0 1 388 308" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  <path d="M420 164 A118 118 0 0 1 420 348" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
