<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #6B1D07 0%, #3A1005 55%, #120502 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #FBD5C0; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #EA6A2E; box-shadow: 0 0 18px #EA6A2E; }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#FBD5C0,#F59A6B); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #EFDCD2; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #FBD5C0; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #C2410C47, transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Affiliates</span></h1>
      <p class="sub">Partner links, commissions, payout lists and joint ventures.</p>
      <div class="badges">
        <span class="badge">Consent-aware</span>
        <span class="badge">Refunds reverse</span>
        <span class="badge">Payments</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#C2410C"/><stop offset="1" stop-color="#431407"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#431407" flood-opacity="0.36"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- a megaphone with two sound waves, see icon.svg -->
        <g transform="translate(-28 0)">
        <g filter="url(#sh)">
          <path d="M92 214 A18 18 0 0 1 110 196 L176 196 L330 118 A16 16 0 0 1 354 132 L354 380 A16 16 0 0 1 330 394 L176 316 L110 316 A18 18 0 0 1 92 298 Z" fill="#FFFFFF"/>
          <path d="M150 316 L196 316 L222 402 A16 16 0 0 1 206 422 L182 422 A16 16 0 0 1 166 410 Z" fill="#FFFFFF"/>
        </g>
        <rect x="164" y="196" width="24" height="120" fill="url(#bg)"/>
        <path d="M388 204 A64 64 0 0 1 388 308" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
        <path d="M420 164 A118 118 0 0 1 420 348" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
